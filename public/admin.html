<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Showroom Admin</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
  <!-- Admin Authentication Modal -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <h2>Admin Authentication</h2>
      <p>Please enter the admin password to access controls.</p>
      <form id="login-form">
        <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password"
          required>
        <button type="submit" id="login-submit-btn">Unlock Admin</button>
        <div id="login-error" class="login-error"></div>
      </form>
    </div>
  </div>

  <div class="header-bar">
    <h1>Showroom admin</h1>
    <button id="logout-btn" class="logout-btn" style="display:none;">Log Out</button>
  </div>
  <div class="tabs">
    <button id="tab-control" class="tab-btn active">Language Control</button>
    <button id="tab-content" class="tab-btn">Content Library</button>
    <button id="tab-screens" class="tab-btn">Screen management</button>
  </div>

  <section id="panel-control" class="tab-panel active">
    <p>Current language: <strong id="current-lang">—</strong></p>

    <div class="buttons">
      <button id="btn-en">English</button>
      <button id="btn-es">Español</button>
    </div>

    <div id="displays">
      <h2 style="font-size:16px;">Connected displays</h2>
      <div id="display-list"><span id="empty">No displays connected yet</span></div>
    </div>
  </section>

  <section id="panel-content" class="tab-panel">
    <h2 style="font-size:16px;">Add content</h2>
    <div class="content-row">
      <label for="content-type">Content type</label>
      <select id="content-type">
        <option value="link">Link (Canva / Genially / webpage)</option>
        <option value="png">PNG upload</option>
      </select>
    </div>
    <div class="content-row">
      <label for="content-screen-type">Content key / screen type</label>
      <input id="content-screen-type" placeholder="example: promo-fall">
    </div>

    <div id="link-fields">
      <div class="content-row">
        <label for="content-provider">Provider label</label>
        <select id="content-provider">
          <option value="link">Generic link</option>
          <option value="canva">Canva</option>
          <option value="genially">Genially</option>
        </select>
      </div>
      <div class="content-row">
        <label for="content-link-en">English URL</label>
        <input id="content-link-en" placeholder="https://...">
      </div>
      <div class="content-row">
        <label for="content-link-es">Spanish URL</label>
        <input id="content-link-es" placeholder="https://...">
      </div>
    </div>

    <div id="png-fields" style="display:none;">
      <div class="content-row">
        <label for="content-png-en">English PNG</label>
        <input id="content-png-en" type="file" accept="image/png">
      </div>
      <div class="content-row">
        <label for="content-png-es">Spanish PNG</label>
        <input id="content-png-es" type="file" accept="image/png">
      </div>
    </div>

    <div class="content-actions">
      <button id="save-content-btn">Save content</button>
    </div>
    <div id="content-message"></div>

    <h2 style="font-size:16px; margin-top:24px;">Library entries</h2>
    <div id="content-list"><span class="muted">No content yet.</span></div>
  </section>

  <section id="panel-screens" class="tab-panel">
    <h2 style="font-size:16px;">Add or update display screen</h2>
    <div class="content-row">
      <label for="screen-id-input">Screen ID / Name</label>
      <input id="screen-id-input" placeholder="e.g. screen2 or lobby-display">
    </div>
    <div class="content-row">
      <label for="screen-default-type">Default Content / Screen Type</label>
      <select id="screen-default-type">
        <!-- Options populated dynamically -->
      </select>
    </div>
    <div class="content-actions">
      <button id="save-screen-btn">Save screen</button>
    </div>
    <div id="screen-message"></div>

    <h2 style="font-size:16px; margin-top:24px;">Configured screen roster</h2>
    <div id="screen-list"><span class="muted">Loading screens...</span></div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin.js" defer></script>
</body>

</html>
